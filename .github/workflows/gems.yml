name: Gems digest (生活冷知識)

# 流程:每天 collect 備好候選 → 你花 ~30 分鐘審 data/queue/gems.md → approve → 週三/週日 send 只寄已核准的。
on:
  schedule:
    - cron: "0 22 * * *"    # 每天 06:00 (台北) collect
    - cron: "0 1 * * 0,3"   # 週三、週日 09:00 (台北) send
  workflow_dispatch:
    inputs:
      task:
        description: "collect=抓取備稿 / approve / reject / unapprove=審稿 / send=寄出已核准的 / send-dry=預覽"
        type: choice
        options: [collect, approve, reject, unapprove, send, send-dry]
        default: collect
      ids:
        description: "approve/reject 的編號,空白分隔,例如 1 3 5"
        type: string
        default: ""

permissions:
  contents: write

concurrency: gems-queue   # 避免同時改佇列

jobs:
  gems:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_SUBSCRIBERS: ${{ secrets.NEWS_SUBSCRIBERS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          INTERESTS: ${{ vars.GEMS_INTERESTS }}
          TASK: ${{ inputs.task || (github.event.schedule == '0 22 * * *' && 'collect' || 'send') }}
          IDS: ${{ inputs.ids }}
        run: |
          case "$TASK" in
            collect)    python -m curator collect --interests "$INTERESTS" ;;
            approve|reject|unapprove) python -m curator queue "$TASK" $IDS ;;
            send)       python -m curator send ;;
            send-dry)   python -m curator send --dry-run ;;
          esac
      - name: Commit queue and history
        run: |
          git config user.name "news-curator"; git config user.email "actions@users.noreply.github.com"
          git add data/queue data/seen_gems.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: gems queue update" && git pull --rebase -q && git push)
