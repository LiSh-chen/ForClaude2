name: Send gems digest (生活冷知識)

on:
  schedule:
    - cron: "0 1 * * 0,3"   # 週三、週日 09:00 (台北時間)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只評分不寄信"
        type: boolean
        default: true
      interests:
        description: "讀者關注主題 (逗號分隔,可留空)"
        type: string
        default: ""

permissions:
  contents: write   # 要把 data/seen_gems.json 寫回 repo

jobs:
  gems:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_SUBSCRIBERS: ${{ secrets.NEWS_SUBSCRIBERS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          INTERESTS: ${{ inputs.interests || vars.GEMS_INTERESTS }}
        run: python -m curator run --profile gems --interests "$INTERESTS" ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
      - name: Commit sent-history
        run: |
          git config user.name "news-curator"; git config user.email "actions@users.noreply.github.com"
          git add data/seen_gems.json || true
          git diff --cached --quiet || (git commit -m "chore: update gems sent history" && git push)
