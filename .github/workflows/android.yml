name: android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (pure Kotlin core)
        run: ./gradlew -p core test

  content-publish:
    # The text pack the app downloads: published only after the tests (which check the content rules) pass.
    needs: core-tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish the content pack
        run: |
          d=$(mktemp -d)
          python3 android/content-tools/build_content.py "$d"
          cd "$d"
          git init -q -b content
          git config user.name "content-publish"
          git config user.email "content-publish@users.noreply.github.com"
          git add -A
          git commit -q -m "Content pack for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" content

  ui-previews:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Render screens
        run: ./gradlew :app:recordPaparazziDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ui-previews
          path: android/app/src/test/snapshots/images/*.png
      - name: Publish to ui-previews branch
        if: github.event_name == 'push'
        run: |
          d=$(mktemp -d)
          cp app/src/test/snapshots/images/*.png "$d"/
          cd "$d"
          git init -q -b ui-previews
          git config user.name "ui-previews"
          git config user.email "ui-previews@users.noreply.github.com"
          git add -A
          git commit -q -m "UI previews for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ui-previews

  app-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
