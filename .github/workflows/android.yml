name: android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (pure Kotlin core)
        run: ./gradlew -p core jvmTest

  ui-previews:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Render screens
        run: ./gradlew :app:recordPaparazziDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ui-previews
          path: android/app/src/test/snapshots/images/*.png
      - name: Publish to ui-previews branch
        if: github.event_name == 'push'
        run: |
          d=$(mktemp -d)
          cp app/src/test/snapshots/images/*.png "$d"/
          cd "$d"
          git init -q -b ui-previews
          git config user.name "ui-previews"
          git config user.email "ui-previews@users.noreply.github.com"
          git add -A
          git commit -q -m "UI previews for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ui-previews

  app-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  # The shared code has to compile for iOS too; that only works on a Mac.
  ios-compile:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # One native build at a time: two Kotlin/Native link tasks in one Gradle run can fight over the compiler
      # ("Cannot get target from triple ..."), so each gets its own run.
      - name: Compile core and shared for the iOS simulator
        run: ./gradlew --no-parallel --max-workers=1 :shared:compileKotlinIosSimulatorArm64 :core:compileKotlinIosSimulatorArm64
      - name: Run the core tests on the iOS simulator
        run: ./gradlew --no-parallel --max-workers=1 :core:iosSimulatorArm64Test
      - name: Run the shared tests on the iOS simulator
        run: ./gradlew --no-parallel --max-workers=1 :shared:iosSimulatorArm64Test
