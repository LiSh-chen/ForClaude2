name: Publish street-view page

# 街景影片產生器放在 site/streetview/，與投資日誌共用同一個 GitHub Pages 網站。
# 此 workflow 只在該頁面變動時，把目前 main 上完整的 site/ 重新發佈（不改動其他內容）。
# 前提：repo Settings → Pages → Source 選 GitHub Actions。

on:
  push:
    branches: [main]
    paths: ["site/streetview/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: invest-journal   # 與日誌 workflow 共用，避免同時部署
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
