name: Invest Journal Daily

# 每個交易日（台股、美股都收盤後）：掃描財經新聞 → 產業評分 → 龍頭/績優股篩選 → 台美各 5 檔含目標價 → 寫研究日誌。
# 跑完後 commit 回 repo，並直接把 site/ 發佈到本 repo 的 GitHub Pages。
# 選用：在 repo Settings → Secrets 新增 ANTHROPIC_API_KEY，日誌會多一段 AI 撰寫的市場摘要與個股評論（量化選股不受影響）。

on:
  schedule:
    # 設計：不賭「排程剛好在開盤前準時跑」（GitHub 排程常延遲，實測曾晚 3 小時以上），
    # 而是在每個市場『收盤後一段時間』就更新，延遲了也早就備好：
    #   ① 台股收盤後（13:30）≈ 台灣 15:07 / 16:37：台股收盤價最新、美股為前一日收盤
    #   ② 美股收盤後（04:00／冬令 05:00）≈ 台灣 05:37 / 06:07 / 06:37 / 07:07：兩邊都最新，覆蓋①
    # 同一基準日只有在『某市場的收盤日比上次更新』才會覆蓋，否則自動略過（約 1 分鐘）。
    # 時間用奇數分鐘以避開整點壅塞。④ 的最後一個機會（07:07）仍比台股開盤前 1.2 小時（07:48）早。
    - cron: "7 7 * * 1-5"     # ① 台灣 15:07（週一至週五）
    - cron: "37 8 * * 1-5"    # ① 台灣 16:37（①的備援）
    - cron: "37 21 * * 1-5"   # ② 台灣 05:37（週二至週六早晨）
    - cron: "7 22 * * 1-5"    # ② 台灣 06:07
    - cron: "37 22 * * 1-5"   # ② 台灣 06:37
    - cron: "7 23 * * 1-5"    # ② 台灣 07:07
  workflow_dispatch:
    inputs:
      force:
        description: "同一基準日已有日誌時仍重新產生"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: invest-journal
  cancel-in-progress: false

jobs:
  daily:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements-journal.txt }
      - run: pip install -r requirements-journal.txt
      - name: Update tracking of past picks (so today's journal quotes fresh performance)
        run: python -m ijournal track
      - name: Write today's journal
        id: daily
        continue-on-error: true   # 品質不合格（exit 2）時仍要提交狀態、重建網站，最後再讓 job 失敗
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m ijournal daily ${{ inputs.force && '--force' || '' }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data journal reviews emerging bargain site config
          git diff --cached --quiet || git commit -m "journal: daily research journal $(date -u +%F)"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Fail the job if the journal was not published (data-quality gate or error)
        if: steps.daily.outcome == 'failure'
        run: |
          echo "::error::日誌未發佈：資料品質不合格或執行錯誤，請看『Write today's journal』步驟的 [quality] 訊息。網站已顯示警示橫幅，上一份好的日誌仍保留。"
          exit 1
