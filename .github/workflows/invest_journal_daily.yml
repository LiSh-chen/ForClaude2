name: Invest Journal Daily

# 每個交易日（台股、美股都收盤後）：掃描財經新聞 → 產業評分 → 龍頭/績優股篩選 → 台美各 5 檔含目標價 → 寫研究日誌。
# 跑完後 commit 回 repo，並直接把 site/ 發佈到本 repo 的 GitHub Pages。
# 選用：在 repo Settings → Secrets 新增 ANTHROPIC_API_KEY，日誌會多一段 AI 撰寫的市場摘要與個股評論（量化選股不受影響）。

on:
  schedule:
    # 目標：台股開盤（台灣 09:00）前約 1.2 小時（≈ 07:48 台灣）更新完成。
    # GitHub 的排程常常延遲（實測曾晚 3 小時以上），所以排多個錯開的觸發點：先跑到的那次產生日誌，
    # 之後的因為「該基準日日誌已存在」會自動略過（約 1 分鐘）。時間用奇數分鐘以避開整點壅塞。
    # 全部落在『美股已收盤、台股尚未開盤』的安全窗口（台灣 05:30–09:00 之間）：
    - cron: "37 21 * * 1-5"   # 台灣 05:37（週二至週六早晨）
    - cron: "7 22 * * 1-5"    # 台灣 06:07
    - cron: "37 22 * * 1-5"   # 台灣 06:37
    - cron: "7 23 * * 1-5"    # 台灣 07:07（最後一個機會；仍比 07:48 早）
  workflow_dispatch:
    inputs:
      force:
        description: "同一基準日已有日誌時仍重新產生"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: invest-journal
  cancel-in-progress: false

jobs:
  daily:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements-journal.txt }
      - run: pip install -r requirements-journal.txt
      - name: Update tracking of past picks (so today's journal quotes fresh performance)
        run: python -m ijournal track
      - name: Write today's journal
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m ijournal daily ${{ inputs.force && '--force' || '' }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data journal reviews emerging site config
          git diff --cached --quiet || git commit -m "journal: daily research journal $(date -u +%F)"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
